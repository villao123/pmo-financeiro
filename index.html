<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento Financeiro — DB Diagnósticos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07090f;--surface:#0f1623;--surface2:#162035;--border:#1e2d45;--border2:#253650;
    --accent:#00b5ae;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;
    --text:#eef2ff;--muted:#4b6080;--muted2:#7a95b5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,181,174,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,181,174,0.02) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
  .wrap{max-width:1400px;margin:0 auto;padding:0 40px;position:relative;z-index:1;}

  header{padding:28px 0 24px;border-bottom:1px solid var(--border);margin-bottom:32px;}
  .header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .logo-area{display:flex;align-items:center;gap:14px;}
  .logo-icon-text{width:42px;height:42px;background:linear-gradient(135deg,#00b5ae,#0891b2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;}
  .logo-text h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;}
  .logo-text p{font-size:11px;color:var(--muted2);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sync-info{font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all 0.18s;white-space:nowrap;}
  .btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border2);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  .stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:16px;transition:border-color 0.2s;}
  .stat-card:hover{border-color:var(--border2);}
  .stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .si-teal{background:rgba(0,181,174,0.12);}
  .si-red{background:rgba(239,68,68,0.12);}
  .si-yellow{background:rgba(245,158,11,0.12);}
  .si-green{background:rgba(16,185,129,0.12);}
  .stat-val{font-size:26px;font-weight:700;line-height:1;letter-spacing:-1px;}
  .stat-val.teal{color:#2dd4bf;}.stat-val.red{color:#fca5a5;}.stat-val.yellow{color:#fcd34d;}.stat-val.green{color:#6ee7b7;}
  .stat-label{font-size:12px;color:var(--muted2);margin-top:4px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  .filter-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-family:'Inter',sans-serif;transition:all 0.15s;}
  .filter-tab:hover{border-color:var(--accent);color:var(--accent);}
  .filter-tab.active{background:rgba(0,181,174,0.1);border-color:var(--accent);color:var(--accent);}
  .filter-tab.active-red{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.4);color:#fca5a5;}
  .filter-tab.active-green{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.4);color:#6ee7b7;}
  .badge-pill{padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(255,255,255,0.08);}
  .search-box{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border2);min-width:240px;}
  .search-box input{background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;width:100%;}
  .search-box input::placeholder{color:var(--muted);}

  .projetos-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .table-header{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 120px 36px;padding:12px 24px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;gap:12px;}

  .projeto-row{border-bottom:1px solid var(--border);transition:background 0.12s,border-left 0.12s;border-left:3px solid transparent;}
  .projeto-row:last-child{border-bottom:none;}
  .projeto-row:nth-child(even){background:rgba(255,255,255,0.014);}
  .projeto-row.open-row{background:rgba(0,181,174,0.04)!important;border-left-color:var(--accent);}
  .projeto-row.estouro{border-left-color:var(--danger)!important;}
  .projeto-main{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 120px 36px;align-items:center;padding:15px 24px;cursor:pointer;gap:12px;transition:background 0.12s;}
  .projeto-main:hover{background:rgba(0,181,174,0.03);}

  .projeto-nome{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;min-width:0;}
  .projeto-nome span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .valor-cell{font-size:13px;font-weight:500;white-space:nowrap;}
  .valor-cell.muted{color:var(--muted2);}
  .valor-cell.ok{color:#6ee7b7;}
  .valor-cell.alert{color:#fca5a5;}
  .valor-cell.warn{color:#fcd34d;}

  .progress-wrap{display:flex;flex-direction:column;gap:4px;}
  .progress-label{font-size:11px;font-weight:600;}
  .progress-label.ok{color:#6ee7b7;}
  .progress-label.alert{color:#fca5a5;}
  .progress-label.warn{color:#fcd34d;}
  .progress-bar-bg{height:4px;background:var(--border2);border-radius:2px;width:100%;}
  .progress-bar{height:4px;border-radius:2px;transition:width 0.8s ease;}
  .progress-bar.ok{background:linear-gradient(90deg,#10b981,#34d399);}
  .progress-bar.alert{background:linear-gradient(90deg,#ef4444,#f87171);}
  .progress-bar.warn{background:linear-gradient(90deg,#f59e0b,#fbbf24);}

  .expand-btn{width:28px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--border2);color:var(--muted2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;justify-self:center;}
  .expand-btn:hover{border-color:var(--accent);color:var(--accent);}
  .expand-btn.open{transform:rotate(180deg);border-color:var(--accent);color:var(--accent);}

  .projeto-detalhe{display:none;padding:0 24px 20px;border-top:1px solid var(--border);}
  .projeto-detalhe.open{display:block;animation:slideDown 0.2s ease both;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  .detalhe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:18px 0 16px;}
  .detalhe-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
  .detalhe-val{font-size:14px;font-weight:600;}
  .detalhe-val.ok{color:#6ee7b7;}.detalhe-val.alert{color:#fca5a5;}.detalhe-val.warn{color:#fcd34d;}.detalhe-val.muted{color:var(--muted2);}

  .saldo-bar-wrap{padding:12px 0 16px;border-top:1px solid var(--border);margin-top:4px;}
  .saldo-bar-label{font-size:11px;color:var(--muted2);margin-bottom:8px;}
  .saldo-bar-bg{height:8px;background:var(--border2);border-radius:4px;position:relative;overflow:visible;}
  .saldo-bar-fill{height:8px;border-radius:4px;position:absolute;top:0;left:0;}
  .saldo-bar-limit{position:absolute;top:-4px;width:2px;height:16px;background:#fff;opacity:0.3;border-radius:1px;}

  /* Tabela mensal */
  .mensal-wrap{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
  .mensal-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
  .mensal-table{width:100%;border-collapse:collapse;font-size:12px;}
  .mensal-table th{padding:7px 12px;text-align:right;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border);background:var(--surface2);}
  .mensal-table th:first-child{text-align:left;}
  .mensal-table td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--border);color:var(--muted2);}
  .mensal-table td:first-child{text-align:left;color:var(--text);font-weight:500;}
  .mensal-table tr:last-child td{border-bottom:none;font-weight:700;color:var(--text);background:rgba(0,181,174,0.05);}
  .mensal-table td.val-zero{color:var(--muted);}
  .mensal-table td.val-pos{color:#6ee7b7;}

  .empty-state{padding:60px 24px;text-align:center;}
  .empty-state .icon{font-size:36px;margin-bottom:12px;opacity:0.4;}
  .empty-state p{color:var(--muted2);font-size:14px;}
  .loading{padding:52px 24px;text-align:center;color:var(--muted2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;background:var(--surface2);border:1px solid var(--border2);box-shadow:0 8px 30px rgba(0,0,0,0.4);transform:translateY(80px);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:999;pointer-events:none;}
  #toast.show{transform:translateY(0);opacity:1;}
  #toast.success{border-color:rgba(16,185,129,0.4);color:#6ee7b7;}
  #toast.error{border-color:rgba(239,68,68,0.4);color:#fca5a5;}

  @media(max-width:900px){
    .stats-strip{grid-template-columns:repeat(2,1fr);}
    .table-header{display:none;}
    .projeto-main{grid-template-columns:1fr 36px;}
    .valor-cell,.progress-wrap{display:none;}
    .wrap{padding:0 16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-inner">
      <div class="logo-area">
        <div class="logo-icon-text">DB</div>
        <div class="logo-text">
          <h1>Monitoramento Financeiro de Projetos</h1>
          <p>DB Diagnósticos · PMO</p>
        </div>
      </div>
      <div class="header-right">
        <div class="sync-info"><div class="dot"></div> Última sync: <span id="ultima-sync">—</span></div>
        <button class="btn btn-ghost" onclick="carregarDados()">🔄 Atualizar</button>
      </div>
    </div>
  </header>

  <div class="stats-strip">
    <div class="stat-card"><div class="stat-icon si-teal">📁</div><div><div class="stat-val teal" id="stat-total">—</div><div class="stat-label">Projetos monitorados</div></div></div>
    <div class="stat-card"><div class="stat-icon si-red">🚨</div><div><div class="stat-val red" id="stat-estouro">—</div><div class="stat-label">Com estouro de orçamento</div></div></div>
    <div class="stat-card"><div class="stat-icon si-yellow">⚠️</div><div><div class="stat-val yellow" id="stat-atencao">—</div><div class="stat-label">Acima de 80% do orçado</div></div></div>
    <div class="stat-card"><div class="stat-icon si-green">✅</div><div><div class="stat-val green" id="stat-ok">—</div><div class="stat-label">Projetos saudáveis</div></div></div>
  </div>

  <div class="toolbar">
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filtrarTab(this,'todos')">Todos <span class="badge-pill" id="badge-todos">0</span></button>
      <button class="filter-tab" onclick="filtrarTab(this,'estouro')">Estouro <span class="badge-pill" id="badge-estouro">0</span></button>
      <button class="filter-tab" onclick="filtrarTab(this,'atencao')">Atenção <span class="badge-pill" id="badge-atencao">0</span></button>
      <button class="filter-tab" onclick="filtrarTab(this,'ok')">Saudável <span class="badge-pill" id="badge-ok">0</span></button>
    </div>
    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Buscar projeto..." id="busca" oninput="renderProjetos()">
    </div>
  </div>

  <div class="projetos-section">
    <div class="table-header">
      <div>Projeto</div>
      <div>Orçado Total</div>
      <div>Realizado</div>
      <div>Previsto</div>
      <div>Utilização</div>
      <div></div>
    </div>
    <div id="proj-list"><div class="loading"><div class="spinner"></div>Buscando dados...</div></div>
  </div>
  <div style="height:48px;"></div>
</div>

<div id="toast"></div>

<script>
  const WORKER = 'https://pmo-financeiro.vitormanu-dl05.workers.dev';
  let todosAlertas = [];
  let filtroAtivo = 'todos';

  function fmt(val) {
    if (!val && val !== 0) return 'R$ —';
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(val);
  }

  async function carregarDados() {
    document.getElementById('proj-list').innerHTML = `<div class="loading"><div class="spinner"></div>Buscando dados...</div>`;
    try {
      const [alertasRes, syncRes] = await Promise.all([
        fetch(`${WORKER}/alertas`),
        fetch(`${WORKER}/sync-info`)
      ]);
      todosAlertas = await alertasRes.json();
      const syncInfo = await syncRes.json();

      if (syncInfo.ultima_sync) {
        const d = new Date(syncInfo.ultima_sync);
        document.getElementById('ultima-sync').textContent = d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      }

      atualizarStats();
      renderProjetos();
    } catch(e) {
      document.getElementById('proj-list').innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>Erro ao conectar com o Worker</p><small>Execute a macro no Excel para sincronizar os dados</small></div>`;
    }
  }

  function atualizarStats() {
    const total = todosAlertas.length;
    const estouro = todosAlertas.filter(p => p.estouro).length;
    const atencao = todosAlertas.filter(p => !p.estouro && p.percentual >= 80).length;
    const ok = todosAlertas.filter(p => !p.estouro && p.percentual < 80).length;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-estouro').textContent = estouro;
    document.getElementById('stat-atencao').textContent = atencao;
    document.getElementById('stat-ok').textContent = ok;
    document.getElementById('badge-todos').textContent = total;
    document.getElementById('badge-estouro').textContent = estouro;
    document.getElementById('badge-atencao').textContent = atencao;
    document.getElementById('badge-ok').textContent = ok;
  }

  function renderTabelaMensal(previsto_mensal) {
    if (!previsto_mensal || previsto_mensal.length === 0) return '';
    const total = previsto_mensal.reduce((s, m) => s + (m.valor || 0), 0);
    const linhas = previsto_mensal.map(m => {
      const v = m.valor || 0;
      const cls = v === 0 ? 'val-zero' : 'val-pos';
      return `<tr><td>${m.mes}</td><td class="${cls}">${fmt(v)}</td></tr>`;
    }).join('');
    return `
      <div class="mensal-wrap">
        <div class="mensal-title">Projeção de Custos — Próximos 6 Meses</div>
        <table class="mensal-table">
          <thead><tr><th>Mês</th><th>Previsto</th></tr></thead>
          <tbody>
            ${linhas}
            <tr><td>Total</td><td>${fmt(total)}</td></tr>
          </tbody>
        </table>
      </div>`;
  }

  function renderProjetos() {
    const el = document.getElementById('proj-list');
    const busca = document.getElementById('busca').value.toLowerCase();
    let lista = [...todosAlertas];

    if (filtroAtivo === 'estouro') lista = lista.filter(p => p.estouro);
    else if (filtroAtivo === 'atencao') lista = lista.filter(p => !p.estouro && p.percentual >= 80);
    else if (filtroAtivo === 'ok') lista = lista.filter(p => !p.estouro && p.percentual < 80);
    if (busca) lista = lista.filter(p => (p.nome||p.id).toLowerCase().includes(busca));

    if (lista.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📁</div><p>Nenhum projeto encontrado</p></div>`;
      return;
    }

    el.innerHTML = lista.map(p => {
      const classe = p.estouro ? 'alert' : p.percentual >= 80 ? 'warn' : 'ok';
      const dotColor = p.estouro ? 'var(--danger)' : p.percentual >= 80 ? 'var(--warning)' : 'var(--success)';
      const pct = Math.min(p.percentual, 150);
      const barWidth = Math.min(pct, 100);
      const saldo = p.saldo;

      return `<div class="projeto-row ${p.estouro?'estouro':''}">
        <div class="projeto-main" onclick="toggleDetalhe('${p.id}')">
          <div class="projeto-nome">
            <div class="status-dot" style="background:${dotColor};box-shadow:0 0 6px ${dotColor};"></div>
            <span>${p.nome||p.id}</span>
          </div>
          <div class="valor-cell muted">${fmt(p.total_orcado)}</div>
          <div class="valor-cell ${classe}">${fmt(p.total_realizado)}</div>
          <div class="valor-cell muted">${fmt(p.total_previsto)}</div>
          <div class="progress-wrap">
            <span class="progress-label ${classe}">${p.percentual}%${p.estouro?' ⚠️':''}</span>
            <div class="progress-bar-bg"><div class="progress-bar ${classe}" style="width:${barWidth}%"></div></div>
          </div>
          <button class="expand-btn" id="expand-${p.id}">▾</button>
        </div>
        <div class="projeto-detalhe" id="detalhe-${p.id}">
          <div class="detalhe-grid">
            <div><div class="detalhe-label">Orçado BC</div><div class="detalhe-val muted">${fmt(p.orcado_bc)}</div></div>
            <div><div class="detalhe-label">Change Request</div><div class="detalhe-val muted">${fmt(p.change_request)}</div></div>
            <div><div class="detalhe-label">Total Orçado</div><div class="detalhe-val muted">${fmt(p.total_orcado)}</div></div>
            <div><div class="detalhe-label">Total Realizado</div><div class="detalhe-val ${classe}">${fmt(p.total_realizado)}</div></div>
            <div><div class="detalhe-label">Total Previsto</div><div class="detalhe-val muted">${fmt(p.total_previsto)}</div></div>
            <div><div class="detalhe-label">Gasto Total</div><div class="detalhe-val ${classe}">${fmt(p.total_gasto)}</div></div>
            <div><div class="detalhe-label">Saldo</div><div class="detalhe-val ${saldo>=0?'ok':'alert'}">${fmt(saldo)}</div></div>
            <div><div class="detalhe-label">Utilização</div><div class="detalhe-val ${classe}">${p.percentual}%</div></div>
          </div>
          <div class="saldo-bar-wrap">
            <div class="saldo-bar-label">Orçado x Utilizado</div>
            <div class="saldo-bar-bg">
              <div class="saldo-bar-fill ${classe}" style="width:${barWidth}%;background:${p.estouro?'var(--danger)':p.percentual>=80?'var(--warning)':'var(--success)'};"></div>
              <div class="saldo-bar-limit" style="left:100%"></div>
            </div>
          </div>
          ${renderTabelaMensal(p.previsto_mensal)}
        </div>
      </div>`;
    }).join('');
  }

  function toggleDetalhe(id) {
    const detalhe = document.getElementById(`detalhe-${id}`);
    const btn = document.getElementById(`expand-${id}`);
    const row = detalhe.closest('.projeto-row');
    const isOpen = detalhe.classList.contains('open');
    document.querySelectorAll('.projeto-detalhe.open').forEach(d => {
      const rid = d.id.replace('detalhe-','');
      d.classList.remove('open');
      document.getElementById(`expand-${rid}`)?.classList.remove('open');
      d.closest('.projeto-row')?.classList.remove('open-row');
    });
    if (!isOpen) { detalhe.classList.add('open'); btn.classList.add('open'); row.classList.add('open-row'); }
  }

  function filtrarTab(el, filtro) {
    filtroAtivo = filtro;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active','active-red','active-green'));
    if (filtro === 'estouro') el.classList.add('active-red');
    else if (filtro === 'ok') el.classList.add('active-green');
    else el.classList.add('active');
    renderProjetos();
  }

  carregarDados();
  setInterval(carregarDados, 10 * 60 * 1000);
</script>
</body>
</html>
